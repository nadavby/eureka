server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Long-lived caching for hashed build assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA routing: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
